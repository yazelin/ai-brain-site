name: 生成桌布

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper
  cancel-in-progress: false

jobs:
  wallpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 安裝相依
        run: pip install --quiet Pillow

      - name: 確認金鑰
        env:
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          CODEX_IMAGE_BASE_URL: ${{ secrets.CODEX_IMAGE_BASE_URL }}
        run: |
          miss=0
          [ -n "$CODEX_IMAGE_KEY" ] || { echo "::error::缺 CODEX_IMAGE_KEY"; miss=1; }
          [ -n "$CODEX_IMAGE_BASE_URL" ] || { echo "::error::缺 CODEX_IMAGE_BASE_URL"; miss=1; }
          [ "$miss" -eq 0 ]

      - name: 生成桌布
        env:
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          CODEX_IMAGE_BASE_URL: ${{ secrets.CODEX_IMAGE_BASE_URL }}
        run: python scripts/generate_wallpaper.py