name: 同步 PWA cache hash

on:
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'posts.json'
      - 'wallpapers.json'
      - 'sw.js'
      - 'images/**'
      - 'audio/**'
      - 'scripts/update_sw_hashes.py'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'posts.json'
      - 'wallpapers.json'
      - 'sw.js'
      - 'images/**'
      - 'audio/**'
      - 'scripts/update_sw_hashes.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pwa-cache-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: 確認 cache hash 已同步
        run: python scripts/update_sw_hashes.py --check

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: 依內容更新 cache hash
        run: python scripts/update_sw_hashes.py
      - name: 寫回變更
        run: |
          if git diff --quiet -- sw.js; then
            echo "cache hash 已是最新"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sw.js
          git commit -m "pwa: update content cache hashes"
          git pull --rebase
          git push
