name: 每日格莉奇日記

on:
  schedule:
    - cron: '10 14 * * *'   # 台北 22:10 每天一篇
  workflow_dispatch:
    inputs:
      force_image:
        description: '強制畫圖（忽略奇偶日規則）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: 裝相依
        run: pip install --quiet google-genai Pillow

      - name: 確認金鑰
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::缺 GEMINI_API_KEY secret，沒辦法看新聞也沒辦法出圖"
            exit 1
          fi

      - name: 產出今日文章
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WEB_BASE_URL: ${{ secrets.GEMINI_WEB_BASE_URL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_IMAGE: ${{ github.event.inputs.force_image == 'true' && '1' || '0' }}
        run: python scripts/generate_post.py