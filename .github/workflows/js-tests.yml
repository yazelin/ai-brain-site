name: JavaScript 單元測試

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**.mjs'
      - '.github/workflows/js-tests.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**.mjs'
      - '.github/workflows/js-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 執行測試
        run: node --test tests/test_tags.mjs
