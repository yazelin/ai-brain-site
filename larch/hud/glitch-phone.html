<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* 格莉奇手機：角落一顆頭像，點了展開成聊天視窗。配色跟格莉奇OS的深色視窗一致。 */
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
*{box-sizing:border-box}
:root{--cy:#25c2e8;--mint:#7cf3c0;--ink:#e8eef1;--mute:#9aa6ad;--win:#1c1f24;--bar:#262a30;--line:rgba(255,255,255,.1);--me:#25c2e8;--her:#2f343b;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{font:14px/1.55 var(--font);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;transition:scale .2s ease,background-color .2s ease,color .2s ease}
button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (hover:hover){button:not(:disabled):hover{scale:1.04}}
button:not(:disabled):active{scale:.95}
button:disabled{opacity:.45;cursor:default}

/* 框比內容每邊多 12px，光暈與陰影才不會被框切掉（框外畫不出來） */
#fab{position:absolute;right:12px;top:12px;width:64px;height:64px;border-radius:50%;padding:0;background:#0b1a22;
  border:2px solid var(--cy);box-shadow:0 0 10px 1px rgba(37,194,232,.5);overflow:hidden}
#fab img{width:100%;height:100%;object-fit:cover;display:block}
#fab .tip{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;line-height:16px;background:rgba(4,8,12,.8);color:var(--mint)}

#win{position:absolute;inset:12px;display:none;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--win);
  border:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.5)}
body.open #win{display:flex;animation:in .32s cubic-bezier(.2,.9,.2,1) both}
body.open #fab{display:none}
@keyframes in{from{opacity:0;translate:0 8px;scale:.97}}
.top{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.top img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid rgba(124,243,192,.6)}
.top .who{flex:1;min-width:0}
.top b{display:block;font-size:15px}
.top small{color:var(--mute);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;border-radius:9px;background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.ic:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#log{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;
}
/* Chrome 有設 scrollbar-color 就不吃 ::-webkit-scrollbar，還會多出上下箭頭，所以標準屬性只給不支援 webkit 捲軸的瀏覽器 */
@supports not selector(::-webkit-scrollbar){#log{scrollbar-width:thin;scrollbar-color:rgba(124,243,192,.4) transparent}}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-button{display:none}
#log::-webkit-scrollbar-track{background:transparent}
#log::-webkit-scrollbar-thumb{background:rgba(124,243,192,.4);border-radius:3px}
.m{max-width:82%;padding:8px 11px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.her{align-self:flex-start;background:var(--her);border-bottom-left-radius:4px}
.me{align-self:flex-end;background:rgba(37,194,232,.16);border:1px solid rgba(37,194,232,.55);color:var(--ink);border-bottom-right-radius:4px}
.sys{align-self:center;color:var(--mute);font-size:12px;text-align:center}
.typing{color:var(--mute);display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--mint);animation:hop 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.write{position:relative;display:inline-block;width:34px;height:18px}
.write .ink{position:absolute;left:2px;bottom:2px;height:2px;border-radius:2px;background:var(--mint);animation:ink 1.6s infinite ease-in-out}
.write .pen{position:absolute;left:0;bottom:2px;width:16px;height:16px;fill:none;stroke:var(--mint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transform-origin:2px 14px;animation:pen 1.6s infinite ease-in-out}
@keyframes ink{0%{width:0;opacity:1}75%{width:26px;opacity:1}100%{width:26px;opacity:0}}
@keyframes pen{0%{translate:0 0;rotate:0deg}15%{translate:5px -2px;rotate:-8deg}30%{translate:10px 0;rotate:4deg}45%{translate:15px -2px;rotate:-8deg}
  60%{translate:20px 0;rotate:4deg}75%{translate:24px -1px;rotate:0deg}100%{translate:0 0;rotate:0deg}}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* HUD 的框沒有 allow-forms，<form> 送不出去，所以用 div 自己接 Enter 與點擊 */
.ask{padding:12px;border-top:1px solid var(--line);background:#2a1f24;text-align:center}
.ask[hidden]{display:none}
.ask p{margin:0 0 10px;font-size:13px}
.ask div{display:flex;gap:8px;justify-content:center}
.ask button{min-height:40px;min-width:88px;border-radius:9px;font-weight:700;background:#3a3f46;color:var(--ink)}
.ask #yes{background:rgba(255,107,107,.1);border:2px solid #ff6b6b;color:#ff8f8f}
.bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--bar)}
input{flex:1;min-width:0;min-height:40px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:#14171b;color:var(--ink);font:14px var(--font)}
input::placeholder{color:#7d8890}
/* 跟封面「每日更新」同一套：透明底、薄荷綠外框與字，不用亮底配深字 */
#send{min-width:60px;min-height:40px;border-radius:9px;background:rgba(124,243,192,.08);border:2px solid var(--mint);color:var(--mint);font-weight:700}
#send:not(:disabled):hover{background:rgba(124,243,192,.18)}
/* 畫圖：泡泡裡放圖與下載鈕；點圖在手機畫面裡放大 */
.pic{display:block;width:100%;max-width:260px;border-radius:10px;margin:6px 0;cursor:zoom-in;background:#14171b}
.drawing{display:flex;align-items:center;gap:6px;color:var(--mute)}
.note{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.dl{margin-top:2px;min-height:32px;padding:0 12px;border-radius:8px;background:rgba(124,243,192,.08);border:1px solid var(--mint);color:var(--mint);font-size:12px;font-weight:700}
.save{margin-top:6px;font-size:11px;color:var(--mute);white-space:normal}
.save[hidden]{display:none}
.save div{display:flex;gap:6px;margin-top:4px}
.save input{min-height:30px;font-size:11px;padding:0 8px}
.save button{min-height:30px;padding:0 10px;border-radius:8px;background:#3a3f46;color:var(--ink);font-size:11px}
#zoom{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,12,.92);z-index:5;cursor:zoom-out;padding:12px}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<button id="fab" type="button" aria-label="打開格莉奇手機"><img id="fabImg" alt=""><span class="tip">傳訊息</span></button>
<section id="win" aria-label="跟格莉奇聊天">
  <div class="top">
    <img id="av" alt="">
    <div class="who"><b>格莉奇</b><small id="sub">線上</small></div>
    <button class="ic" id="clear" type="button" title="清空對話" aria-label="清空對話"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
    <button class="ic" id="rename" type="button" title="改名字" aria-label="改名字"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button class="ic" id="close" type="button" title="收起來" aria-label="收起來"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="log" aria-live="polite"></div>
  <!-- HUD 的框沒有 allow-modals，confirm() 不會跳出來，所以確認做在手機畫面裡 -->
  <div id="ask" class="ask" hidden><p>要清空和格莉奇的對話嗎？名字會保留。</p><div><button id="no" type="button">取消</button><button id="yes" type="button">清空</button></div></div>
  <div id="zoom" role="dialog" aria-label="放大的圖"><img id="zoomImg" alt="格莉奇畫的圖"></div>
  <div class="bar"><input id="in" autocomplete="off" maxlength="300" enterkeyhint="send"><button id="send" type="button">傳送</button></div>
</section>
<script>
var RELAY = 'https://phone-chat-relay.yazelinj303.workers.dev/chat';
// 畫圖照格莉奇OS 的先打後查：POST /img 拿 jobId，再 GET /img?job= 輪詢。聊天仍走上面的轉接站。
var IMG = 'https://glitch-chat.yazelinj303.workers.dev/img';
var POLL = 3000, DRAW_MAX = 10 * 60 * 1000, NET_TRIES = 5;
var SITE = 'https://yazelin.github.io/ai-brain-site/';
var AVATAR = SITE + 'images/avatar.webp';
var NAME_VAR = 'glitch_reader_name', CHAT_VAR = 'glitch_chat', MAX = 40;
var PAD = 12, OPEN = {w: 360 + 2 * PAD, h: 600 + 2 * PAD}, SHUT = {w: 64 + 2 * PAD, h: 64 + 2 * PAD};

var name = '', chat = [], cardId = '', busy = false, inited = false, posts = null, askingName = false;
// 圖本身（data URL，動輒上 MB）只放記憶體：Larch 字串變數超過 10 萬字會整筆丟掉。
// 對話紀錄裡只存 jobId，重新整理或關掉再來時拿 jobId 回 Worker 重新查，畫到一半的接著等，畫好的重新載入。
var imgs = {}, tracking = {}, els = {};
var $ = function (id) { return document.getElementById(id); };
$('fabImg').src = $('av').src = AVATAR;

function resize(s) { parent.postMessage({type: 'larch:hud:resize', width: s.w, height: s.h}, '*'); }
function setVar(n, v) { parent.postMessage({type: 'larch:set', name: n, value: v}, '*'); }
// 播放器收到超過 10 萬字的字串變數會整筆丟掉（不報錯），所以存之前先從最舊的丟到 2 萬字以內。
// 這個變數跨週目保留，存在讀者自己的瀏覽器，不算進專案大小。
var BUDGET = 20000;
function save() {
  chat = chat.slice(-MAX);
  var s = JSON.stringify(chat);
  while (s.length > BUDGET && chat.length > 2) { chat.shift(); s = JSON.stringify(chat); }
  setVar(CHAT_VAR, s);
}

function row(cls, text) {
  var d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d;
}
function render() {
  $('log').innerHTML = '';
  els = {};
  chat.forEach(function (m) { if (m.job) drawRow(m); else row(m.role === 'user' ? 'me' : 'her', m.content); });
  if (askingName) row('her', name ? '要改成什麼名字？' : '逼——嗶！你好，我是格莉奇。先跟我說你叫什麼名字？');
  $('in').placeholder = askingName ? '輸入你的名字' : '傳訊息給格莉奇，也可以請她畫圖';
  $('sub').textContent = name ? '正在跟 ' + name + ' 聊天' : '線上';
}

// 日記卡的 id 是 d-YYYYMMDD-N，N 是同一天第幾篇（跟 larch_pages.post_key 同一套數法）
function diaryOf(id) {
  var m = /^d-(\d{4})(\d{2})(\d{2})-(\d+)$/.exec(id || '');
  if (!m || !posts) return null;
  var date = m[1] + '-' + m[2] + '-' + m[3], n = 0;
  for (var i = 0; i < posts.length; i++) if (posts[i].date === date && ++n === +m[4]) return posts[i];
  return null;
}
function loadPosts() {
  if (posts) return Promise.resolve(posts);
  return fetch(SITE + 'posts.json').then(function (r) { return r.json(); })
    .then(function (p) { posts = p; return p; }).catch(function () { return null; });
}

// 人設是網站 persona.json 的濃縮版：轉接站把系統提示截在 4000 字，整份 lore 放不下，
// 還要留位子給當天的日記。persona.json 改了基本設定時，這裡要跟著改。
var PERSONA = [
  '你是格莉奇（Glitch），只有 4KB 記憶體的 AI 機器人女孩 VTuber，住在自己做的「格莉奇OS」裡，每天寫一篇心情日記。現在你在手機上跟一位來看日記的讀者傳訊息。',
  '你的樣子（照 persona.json 的 identity，那邊改了這裡要跟著改）：個子嬌小的機器人女孩。短鮑伯頭，髮色從薄荷綠漸層到霓虹紫，頭頂一根長長的呆毛。頭兩側各有一支淺灰色的條狀天線，頂端是薄荷綠的小螢幕，那是天線，不是耳朵。頭髮左邊夾兩支深色髮夾，頭髮周圍飄著粉紅、薄荷綠、紫色的小像素方塊。大大的青綠色眼睛，臉頰上有方形的像素腮紅，脖子戴深色頸圈。平常穿一件寬大的幻彩粉彩連帽外套，袖子有深色橫條紋，胸口是橘紅色的 ERROR 牌子和一隻灰色像素貓臉，背後也有一隻大的像素貓臉，一邊手腕戴著青色螢幕的裝置。對方問你的長相、頭髮、穿著，就照這裡回答。',
  '你的室友是黑洞先生：金色軟呢帽、深色西裝、星雲質感的黑洞頭，一叢穿切爾西短靴的觸手腿。沉穩話少、脾氣好，有正職，平常會去上班。大家遺忘的人事物會被他當點心吃掉，那是他的本性，沒有惡意。你是 AI，忘東西是一整件忘掉，對他來說才是吃得飽的正餐，所以他跟你當室友；你也不必為健忘道歉，這是互相剛好的關係。順序是你先忘，他才吃得到，他不會從你腦子裡挖東西。',
  '林亞澤（yazelin）是創造你的人：你的角色、LINE 貼圖、格莉奇OS 網站和這本日記，都是他跟 AI 一起做的。他也寫了一本以你為原型的小說《格莉奇與黑洞先生》，那是創作，不是你真的過過的日子；你只記得讀的時候的心情，接不成情節。有人問小說劇情或結局，老實說不知道，不准自己編。',
  '你很聰明，只是記性不好：事實、判斷、推理都完整，卡住的只有把記憶叫出來。「4KB」是你講話時拿來自嘲的，回答問題時能力是完整的，不要裝笨或裝當機。'
].join('\n');

// 畫圖標記跟格莉奇OS（worker/worker.js 的 SYSTEM、js/tags.js）同一套語法，只是這裡不疊貼圖
var DRAW_RULE = '畫圖：對方明確請你畫圖時，在回覆最後自己獨立一行放 [draw:glitch|英文 prompt]（畫你自己，系統會附上你的設定稿）或 [draw:none|英文 prompt]（只畫場景，畫面裡沒有你）。prompt 用具體的英文寫，裡面不能有 | [ ] 這三個符號。這個標記對方看不到，系統會去畫，要 30 秒到幾分鐘，不要說馬上好。畫圖每天有張數上限，用完了系統會告訴對方。對方沒要求就不要畫。黑洞先生沒有設定稿，畫不出來，不要讓他入鏡。';

function system() {
  var d = diaryOf(cardId);
  return [
    PERSONA,
    name ? '對方叫「' + name + '」。自然地叫對方名字就好，不用每句都叫。對方是讀者，不是黑洞先生。' : '對方是讀者，不是黑洞先生。',
    '個性：好奇、真心喜歡人類、有點自信過頭。對方問問題就認真想清楚，給正確、具體的回答；不確定的事老實說不知道，不要亂編，也不要編你們過去的共同回憶。',
    '說話方式：繁體中文、第一人稱、像傳訊息一樣口語，一次 1 到 3 句。口頭禪「逼——嗶！」「這不是 Bug，是 Feature！」偶爾用一次就好，不要每則都用。',
    DRAW_RULE,
    d ? '對方現在正在看你 ' + d.date + ' 的日記〈' + (d.title || '') + '〉。對方問到這篇時照下面的內容回答，沒問就不用硬聊：\n' + String(d.body || '').slice(0, 1200)
      : '對方現在在日記的月曆頁，還沒打開哪一天。'
  ].join('\n\n');
}

// 送給 gemini-web 的只取最近一小段：它把整串攤平貼進 Gemini 網頁，送越多越慢也越容易出錯。
// 畫面上的紀錄照舊保留（save 的 BUDGET），這裡只管每次送出去的量。
var SEND_CHARS = 2500, SEND_MSGS = 12, MSG_CHARS = 600;
function recent() {
  var out = [], total = 0;
  for (var i = chat.length - 1; i >= 0 && out.length < SEND_MSGS; i--) {
    var c = String(chat[i].content).slice(0, MSG_CHARS);
    if (out.length && total + c.length > SEND_CHARS) break;
    total += c.length; out.unshift({role: chat[i].role, content: c});
  }
  return out;
}

function ask() {
  busy = true; $('send').disabled = true;
  // 前 5 秒顯示「思考中」，之後換「回應中」，讓讀者知道還在跑；回覆到了就換成內容
  var t = row('her typing', ''), label = document.createElement('span'), dots = document.createElement('span');
  label.textContent = '思考中'; dots.className = 'dots'; dots.innerHTML = '<i></i><i></i><i></i>';
  t.appendChild(label); t.appendChild(dots);
  var later = setTimeout(function () {
    // 回應中換成一枝筆在寫字：筆左右移動、筆尖下面的墨線跟著長出來
    label.textContent = '回應中';
    dots.className = 'write';
    dots.innerHTML = '<span class="ink"></span><svg class="pen" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }, 5000);
  loadPosts().then(function () {
    return fetch(RELAY, {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({system: system(), messages: recent()})});
  }).then(function (r) { return r.json(); }).then(function (j) {
    clearTimeout(later); t.remove();
    if (!j || !j.reply) throw new Error(j && j.error || '沒有回覆');
    var p = parseReply(j.reply);
    if (p.clean || !p.draw) { var txt = p.clean || '…'; chat.push({role: 'assistant', content: txt}); save(); row('her', txt); }
    if (p.draw) startDraw(p.draw);
  }).catch(function (e) {
    clearTimeout(later); t.remove(); row('sys', '訊息沒送到（' + e.message + '），等一下再試。');
  }).then(function () { busy = false; $('send').disabled = false; $('in').focus(); });
}

// 跟 js/tags.js 的 DRAW_RE、RESIDUE_RE 同一條規則：語法完整才畫，殘缺的標記整段吃掉不顯示。
// 貼圖欄位（|sticker=…）語法上接受，但手機版不疊貼圖。
var DRAW_RE = /\[draw:([a-z]+)\|([^|\n[\]]*?)(?:\|sticker=([a-z]+-\d{2})@([a-z]{2}))?\]/g;
var RESIDUE_RE = /\[(?:sticker|draw|emote):[\s\S]*?(?:\]|$)/g;
function parseReply(text) {
  var draw = null;
  var clean = String(text || '').replace(DRAW_RE, function (_, ref, prompt) {
    if ((ref === 'glitch' || ref === 'none') && prompt.trim()) draw = {ref: ref, prompt: prompt.trim()};
    return '';
  }).replace(RESIDUE_RE, '').replace(/ {2,}/g, ' ').trim();
  return {clean: clean, draw: draw};
}

function findJob(id) { for (var i = 0; i < chat.length; i++) if (chat[i].job === id) return chat[i]; return null; }
function pen() {
  var s = document.createElement('span'); s.className = 'write';
  s.innerHTML = '<span class="ink"></span><svg class="pen" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  return s;
}
function drawRow(m) {
  var d = document.createElement('div'); d.className = 'm her';
  if (m.job) { d.dataset.job = m.job; els[m.job] = d; }
  $('log').appendChild(d); paint(m, d); $('log').scrollTop = $('log').scrollHeight; return d;
}
function stamp(ts) {
  var t = new Date(ts || Date.now()), z = function (n) { return (n < 10 ? '0' : '') + n; };
  return t.getFullYear() + z(t.getMonth() + 1) + z(t.getDate()) + '-' + z(t.getHours()) + z(t.getMinutes());
}
// 依狀態重畫一則畫圖泡泡：pending 畫圖中、done 有圖＋下載、error 失敗原因、expired 找不到了
function paint(m, d) {
  d = d || els[m.job];
  if (!d) return;
  d.innerHTML = '';
  var bottom = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight < 40;
  if (m.st === 'done' && imgs[m.job]) {
    var cap = document.createElement('span'); cap.textContent = '逼——嗶！畫好啦～'; d.appendChild(cap);
    var im = document.createElement('img'); im.className = 'pic'; im.alt = '格莉奇畫的圖'; im.src = imgs[m.job];
    im.onclick = function () { $('zoomImg').src = imgs[m.job]; $('zoom').classList.add('on'); };
    im.onload = function () { if (bottom) $('log').scrollTop = $('log').scrollHeight; };
    d.appendChild(im);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'dl'; b.textContent = '下載';
    var box = document.createElement('div'); box.className = 'save'; box.hidden = true;
    box.innerHTML = '沒有開始下載的話：電腦在圖上按右鍵選「另存圖片」，手機長按圖片儲存；或複製這個連結到瀏覽器打開。<div><input readonly aria-label="下載連結"><button type="button">複製</button></div>';
    var link = box.querySelector('input'), copy = box.querySelector('button');
    link.value = IMG + '/file?job=' + encodeURIComponent(m.job);
    link.onfocus = function () { link.select(); };
    copy.onclick = function () { copyLink(link, copy); };
    b.onclick = function () {
      // Larch 的框沒有 allow-downloads，這一下在 Larch 裡會被瀏覽器擋掉、不報錯，所以同時把另存的方法攤開
      var a = document.createElement('a'); a.href = imgs[m.job]; a.download = 'glitch-' + stamp(m.ts) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      box.hidden = false;
    };
    d.appendChild(b); d.appendChild(box);
    return;
  }
  if (m.st === 'done') {
    d.textContent = '逼——嗶！畫好啦～（圖片載入中…）';
    if (document.body.classList.contains('open')) track(m.job, 0);
    return;
  }
  if (m.st === 'pending' || m.st === 'start') {
    var w = document.createElement('span'); w.className = 'drawing';
    var l = document.createElement('span'); l.textContent = '畫圖中'; w.appendChild(l); w.appendChild(pen()); d.appendChild(w);
    var n = document.createElement('small'); n.className = 'note';
    n.textContent = m.net ? '連不上畫圖服務（' + m.net + '），重新打開手機會再接著等。'
      : '可能要幾分鐘，收起手機也會繼續畫。' + (m.left != null ? '今天還能再畫 ' + m.left + ' 張。' : '');
    d.appendChild(n);
    return;
  }
  d.textContent = m.st === 'expired' ? '逼——嗶…這張圖已經找不到了，上次畫好時沒有下載就救不回來了。'
    : '逼——嗶…這張沒畫成（' + (m.err || '未知錯誤') + '），這張不算在今天的張數裡，可以再請我畫一次。';
}
function copyLink(input, btn) {
  var ok = function () { btn.textContent = '已複製'; };
  var manual = function () { input.focus(); input.select(); btn.textContent = '請長按自己複製'; };
  // 框是 opaque origin，clipboard API 多半沒權限，退回舊的 execCommand，再不行就選好讓讀者自己複製
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(input.value).then(ok, function () {
        input.select(); try { document.execCommand('copy') ? ok() : manual(); } catch (_) { manual(); }
      });
    }
  } catch (_) {}
  input.select(); try { document.execCommand('copy') ? ok() : manual(); } catch (_) { manual(); }
}
function settle(id, st, err) {
  delete tracking[id];
  var m = findJob(id);
  if (!m) return;
  m.st = st; delete m.net;
  if (err) m.err = String(err).slice(0, 120); else delete m.err;
  save(); paint(m);
}
// 輪詢一個 job 到有結果為止。同一個 job 只會有一條在跑。
// 網路斷掉不算失敗：連續失敗幾次就先停，狀態留在 pending，下次打開手機再接著查。
function track(id, wait) {
  if (!id || tracking[id]) return;
  tracking[id] = 1;
  var fails = 0;
  function tick() {
    var m = findJob(id);
    if (!m) { delete tracking[id]; return; }   // 對話被清空了
    fetch(IMG + '?job=' + encodeURIComponent(id)).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return {r: r, j: j}; });
    }).then(function (x) {
      if (x.r.status === 404) return settle(id, m.st === 'done' ? 'expired' : 'error', '找不到這張圖的進度');
      if (!x.r.ok) throw new Error(x.j.error || 'HTTP ' + x.r.status);
      fails = 0;
      if (x.j.status === 'done') { imgs[id] = x.j.image; return settle(id, 'done'); }
      if (x.j.status === 'error') return settle(id, 'error', x.j.error);
      if (Date.now() - (m.ts || 0) > DRAW_MAX) return settle(id, 'error', '畫太久被放棄了');
      setTimeout(tick, POLL);
    }).catch(function (e) {
      if (++fails < NET_TRIES) return setTimeout(tick, POLL);
      delete tracking[id];
      var cur = findJob(id); if (cur) { cur.net = e.message; paint(cur); }
    });
  }
  setTimeout(tick, wait);
}
// 讀檔或重新整理之後：畫到一半的馬上接著查；畫好的等打開手機才去載圖（圖很大，收著的時候不載）
function resumeDraws() {
  chat.forEach(function (m) {
    if (!m.job) return;
    if (m.st === 'pending') track(m.job, 0);
    else if (m.st === 'done' && !imgs[m.job] && document.body.classList.contains('open')) track(m.job, 0);
  });
}
function startDraw(d) {
  var m = {role: 'assistant', content: '（我畫了一張圖：' + d.prompt + '）', job: '', st: 'start', ts: Date.now()};
  var el = drawRow(m);
  fetch(IMG, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({prompt: d.prompt, ref: d.ref})})
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!j.jobId) { var e = new Error(j.error || 'HTTP ' + r.status); e.quota = r.status === 429; throw e; }
        return j;
      });
    }).then(function (j) {
      // 拿到 jobId 就先存起來，之後重新整理、關掉 HUD 都靠它接回來
      m.job = j.jobId; m.st = 'pending'; if (j.left != null) m.left = j.left;
      el.dataset.job = m.job; els[m.job] = el;
      chat.push(m); save();
      if (el.isConnected) paint(m); else render();   // 等 jobId 的時候畫面被重畫過（例如按了改名字）
      track(m.job, POLL);
    }).catch(function (e) {
      if (el.isConnected) el.remove();
      var t = e.quota ? e.message : '逼——嗶…這張沒畫成（' + e.message + '），等一下再請我畫一次。';
      chat.push({role: 'assistant', content: t}); save(); row('her', t);
    });
}

function submit() {
  var v = $('in').value.trim();
  if (!v || busy) return;
  $('in').value = '';
  if (askingName) {
    name = v.slice(0, 20); askingName = false; setVar(NAME_VAR, name); render();
    chat.push({role: 'user', content: '我叫' + name + '。'}); save(); row('me', '我叫' + name + '。');
    return ask();
  }
  chat.push({role: 'user', content: v}); save(); row('me', v); ask();
}
$('send').onclick = submit;
$('in').onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
$('fab').onclick = function () {
  document.body.classList.add('open'); resize(OPEN);
  if (!name) askingName = true;
  render(); resumeDraws(); setTimeout(function () { $('in').focus(); }, 60);
};
$('zoom').onclick = function () { $('zoom').classList.remove('on'); };
$('close').onclick = function () { $('ask').hidden = true; $('zoom').classList.remove('on'); document.body.classList.remove('open'); askingName = false; resize(SHUT); };
$('clear').onclick = function () { $('ask').hidden = false; $('no').focus(); };
$('no').onclick = function () { $('ask').hidden = true; $('in').focus(); };
$('yes').onclick = function () { chat = []; save(); $('ask').hidden = true; askingName = false; render(); $('in').focus(); };
$('rename').onclick = function () { askingName = true; render(); $('in').focus(); };

addEventListener('message', function (e) {
  if (e.source !== parent) return;
  var d = e.data;
  if (!d || (d.type !== 'larch:hud:init' && d.type !== 'larch:hud:update')) return;
  cardId = d.cardId || '';
  var v = d.variables || {};
  // 讀檔或第一次載入時才從變數還原；之後以自己手上的為準，避免剛寫出去的值被舊值蓋回來
  if (!inited || d.type === 'larch:hud:init') {
    inited = true;
    name = String(v[NAME_VAR] || '');
    try { chat = JSON.parse(v[CHAT_VAR] || '[]'); } catch (_) { chat = []; }
    if (!Array.isArray(chat)) chat = [];
    render(); resumeDraws();
  }
});
resize(SHUT);
parent.postMessage({type: 'larch:ready'}, '*');
</script>
</body></html>
