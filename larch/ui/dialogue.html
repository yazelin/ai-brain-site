<style>
:root{--cy:#25c2e8;--mint:#7cf3c0;--hair:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
body{padding:8px 12px;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.box{position:relative;min-height:150px;border-radius:14px;overflow:hidden;color:#e8eef1;
  background:linear-gradient(180deg,rgba(39,42,47,.93),rgba(25,28,32,.93));border:1px solid var(--hair);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb{padding:14px clamp(22px,3vw,48px) 0}
.name{display:inline-block;padding:3px 12px;border-radius:7px;background:rgba(37,194,232,.12);border:1px solid rgba(37,194,232,.45);font-size:15px;font-weight:700;color:var(--cy);letter-spacing:.06em}
.name:empty{display:none}
.text{margin:0;padding:10px clamp(22px,3vw,48px) 22px;font-size:var(--larch-text-size,22px);line-height:1.7;min-height:3.4em}
.next{position:absolute;right:16px;bottom:12px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--cy);cursor:pointer}
.next::before{content:"";position:absolute;left:9px;top:8px;border-left:12px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;animation:blink 1.1s steps(2) infinite}
.next:hover{background:rgba(37,194,232,.12)}
.next:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
@keyframes blink{50%{opacity:.25}}
@media (max-width:720px){.text{font-size:var(--larch-text-size,18px);padding:12px 16px 18px}}
@media (prefers-reduced-motion:reduce){.next::before{animation:none}}
</style>
<section class="box" aria-label="對話">
  <div class="tb"><span class="name" data-larch-slot="speaker"></span></div>
  <p class="text" data-larch-slot="text"></p>
  <button class="next" data-larch-action="advance" aria-label="繼續"></button>
</section>
