<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen&display=swap");
:root{--cy:#25c2e8;--mint:#7cf3c0;--purple:#b78bff;--ink:#e8eef1}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden}
/* 只蓋左邊：日記視窗在畫面左 64%，右邊站著格莉奇，對話框跟視窗對齊，不擋到她 */
body{padding:8px 12px;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
/* 生圖的全息壓克力視窗（larch/ui/window.webp）切九格，講話的人名字放在標題列 */
.box{position:relative;width:63%;min-height:120px;color:var(--ink);border-style:solid;border-width:34px 22px 22px 22px;
  border-image:url("https://yazelin.github.io/ai-brain-site/larch/ui/window.webp") 130 77 82 75 fill / 34px 22px 22px 22px stretch;
  clip-path:inset(0 round 12px);filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
.tb{position:absolute;top:-27px;left:40px;right:40px;text-align:center}
.name{display:inline-block;font:13px/1 "Silkscreen","Noto Sans TC",sans-serif;letter-spacing:.14em;color:#06221a;background:var(--mint);
  border-radius:4px;padding:3px 10px;box-shadow:0 0 10px rgba(124,243,192,.6)}
.name:empty{display:none}
.text{margin:0;padding:6px clamp(10px,1.6vw,26px) 10px;font-size:var(--larch-text-size,22px);line-height:1.7;min-height:3.4em;text-shadow:0 1px 3px rgba(4,10,16,.8)}
.next{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--mint);cursor:pointer}
.next::before{content:"";position:absolute;left:9px;top:8px;border-left:12px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;
  animation:blink 1.1s steps(2) infinite;filter:drop-shadow(0 0 4px var(--mint))}
.next:hover{background:rgba(124,243,192,.14)}
.next:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
@keyframes blink{50%{opacity:.25}}
@media (max-width:720px){body{padding:6px 8px}.box{width:auto;min-height:0;border-width:28px 16px 16px 16px;border-image-width:28px 16px 16px 16px}
  .tb{top:-23px}.text{font-size:min(var(--larch-text-size,16px),16px);line-height:1.6;padding:2px 4px 6px;min-height:0}}
@media (prefers-reduced-motion:reduce){.next::before{animation:none}}
/* 播放器會替台詞套明體，這裡換回網站的黑體 */
html{--larch-project-font:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif!important}
</style>
<section class="box" aria-label="對話">
  <div class="tb"><span class="name" data-larch-slot="speaker"></span></div>
  <p class="text" data-larch-slot="text"></p>
  <button class="next" data-larch-action="advance" aria-label="繼續"></button>
</section>
