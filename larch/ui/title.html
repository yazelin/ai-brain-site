<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen&display=swap");
:root{color-scheme:dark;--cy:#25c2e8;--mint:#7cf3c0;--purple:#b78bff;--pink:#ff8fd0;--err:#ff6b4a;--mute:#9fb0b8;--ink:#e8eef1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04080c;overflow:hidden}
main{position:relative;height:100dvh;color:var(--ink)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.72) saturate(1.05)}
/* 左邊暗下來，視窗站得住；右邊留給格莉奇 */
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,16,.78) 0%,rgba(4,10,16,.45) 45%,rgba(4,10,16,0) 70%)}
.mb{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:18px;padding:0 14px;background:rgba(4,8,12,.82);
  border-bottom:1px solid rgba(124,243,192,.18);font:12px/1 "Silkscreen",monospace;letter-spacing:.06em;color:var(--mute)}
.mb b{color:var(--mint);font-weight:400}.mb .sp{flex:1}.mb .k{color:var(--purple)}
/* 生圖的全息壓克力視窗（larch/ui/window.webp）切九格：四角像素括號與標題列照原比例，中間跟著內容伸展 */
.win{position:absolute;left:clamp(16px,6vw,120px);top:52%;transform:translateY(-50%);width:min(600px,88vw);max-height:84dvh;
  display:flex;flex-direction:column;border-style:solid;border-width:52px 30px 32px 30px;
  border-image:url("https://yazelin.github.io/ai-brain-site/larch/ui/window.webp") 130 77 82 75 fill / 52px 30px 32px 30px stretch;
  clip-path:inset(0 round 18px);filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.ttl{position:absolute;top:-42px;left:0;right:0;text-align:center;font:13px/1 "Silkscreen",monospace;letter-spacing:.12em;color:#16283a;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.body{position:relative;display:flex;flex-direction:column;min-height:0;padding:10px 22px 18px}
.tag{font:12px/1 "Silkscreen",monospace;letter-spacing:.14em;color:var(--mint);margin-bottom:10px}
.tag i{display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:blink 1.1s steps(2) infinite}
h1{margin:0 0 12px;font:700 clamp(30px,3.6vw,46px)/1.2 "Noto Sans TC",sans-serif;letter-spacing:.06em;
  background:linear-gradient(90deg,var(--mint),var(--cy) 45%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(37,194,232,.35))}
/* 簡介比視窗長時這一塊自己捲動，底部淡出，捲到底才拿掉 */
p{flex:1;min-height:0;overflow-y:auto;margin:0 0 18px;padding-right:8px;white-space:pre-line;color:var(--mute);font:15px/1.75 "Noto Sans TC",sans-serif;
  scrollbar-width:thin;scrollbar-color:rgba(124,243,192,.5) transparent;max-height:34dvh;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
p.end{-webkit-mask-image:none;mask-image:none}
nav{flex:none;display:flex;flex-direction:column;gap:10px}
button{font:500 16px/1 "Noto Sans TC",sans-serif;letter-spacing:.2em;padding:13px 18px;border-radius:8px;cursor:pointer;color:var(--ink);
  background:rgba(124,243,192,.05);border:1px solid rgba(183,139,255,.45);transition:border-color .15s,color .15s,background .15s,box-shadow .15s}
button[data-larch-action="start"]{color:#06221a;font-weight:700;border:0;background:linear-gradient(90deg,var(--mint),var(--cy));box-shadow:0 0 18px rgba(124,243,192,.45)}
button:hover,button:focus-visible{outline:none;border-color:var(--mint);color:var(--mint);background:rgba(124,243,192,.12)}
button[data-larch-action="start"]:hover,button[data-larch-action="start"]:focus-visible{color:#06221a;box-shadow:0 0 26px rgba(124,243,192,.75)}
button:focus-visible{box-shadow:0 0 0 3px var(--purple)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button[hidden]{display:none}
.os{margin-top:14px;font:12px/1.4 "Silkscreen",monospace;letter-spacing:.04em;color:var(--mute);user-select:text}
.os b{color:var(--cy);font-weight:400}
/* 右邊站著格莉奇，輕輕浮著；偶爾閃一下像素故障 */
.gl{position:absolute;right:clamp(0px,6vw,140px);bottom:-4dvh;height:96dvh;animation:bob 4.2s ease-in-out infinite}
.gl img{height:100%;display:block;filter:drop-shadow(0 0 22px rgba(124,243,192,.25));animation:glitch 7s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes glitch{0%,93%,100%{transform:none;filter:drop-shadow(0 0 22px rgba(124,243,192,.25))}
  94%{transform:translateX(4px);filter:drop-shadow(-3px 0 0 rgba(255,143,208,.8)) drop-shadow(3px 0 0 rgba(37,194,232,.8))}
  96%{transform:translateX(-3px)}}
/* 她頭髮旁邊會飄的粉、綠、紫小像素方塊 */
.px{position:absolute;width:var(--s);height:var(--s);background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;animation:px var(--d) ease-in-out var(--w) infinite}
@keyframes px{0%,100%{opacity:0;transform:translateY(0)}20%,80%{opacity:.9}50%{transform:translateY(var(--y))}}
@keyframes blink{50%{opacity:.2}}
.boot{position:absolute;inset:0;z-index:5;background:#04080c;display:flex;align-items:center;justify-content:center;animation:off .5s 2.6s forwards;
  background-image:repeating-linear-gradient(0deg,rgba(124,243,192,.04) 0 1px,transparent 1px 3px)}
.boot pre{margin:0;font:14px/1.75 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;color:var(--mint)}
.boot pre span{display:block;opacity:0;animation:on .01s forwards}
.boot pre span:nth-child(2n){color:var(--purple)}
.boot pre span:nth-child(1){animation-delay:.1s}.boot pre span:nth-child(2){animation-delay:.45s}.boot pre span:nth-child(3){animation-delay:.8s}
.boot pre span:nth-child(4){animation-delay:1.15s}.boot pre span:nth-child(5){animation-delay:1.5s}.boot pre span:nth-child(6){animation-delay:1.85s}
@keyframes on{to{opacity:1}}@keyframes off{to{opacity:0;visibility:hidden}}
@media (max-width:720px){
  .shade{background:linear-gradient(0deg,rgba(4,10,16,.9) 0%,rgba(4,10,16,.5) 55%,rgba(4,10,16,.05) 100%)}
  .gl{right:50%;transform:translateX(50%);height:70dvh;bottom:auto;top:4dvh;animation:none}
  .win{top:auto;bottom:12px;transform:none;left:0;right:0;margin:0 auto;width:calc(100vw - 24px);max-height:62dvh;border-width:46px 22px 22px 22px;
    border-image-width:46px 22px 22px 22px}
  .ttl{top:-34px}.body{padding:6px 14px 12px}p{max-height:22dvh;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.boot{display:none}.px,.gl,.gl img,.tag i{animation:none}.px{opacity:.6}button{transition:none}}
/* 播放器會替標題與台詞套明體，這裡換回網站的黑體 */
html{--larch-project-font:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif!important}
</style>
<main>
  <img class="art" id="wall" alt="">
  <div class="shade"></div>
  <div class="mb"><b>GLITCH OS</b><span class="sp"></span><span>MEMORY <span class="k">4KB</span></span></div>
  <div class="gl" aria-hidden="true"><img src="https://yazelin.github.io/ai-brain-site/larch/sprites/happy.webp" alt=""></div>
  <div id="px" aria-hidden="true"></div>
  <section class="win">
    <div class="ttl">MOOD_DIARY.EXE</div>
    <div class="body">
      <div class="tag"><i></i>4KB MEMORY · DAILY LOG</div>
      <h1 data-larch-slot="title"></h1>
      <p data-larch-slot="description"></p>
      <nav aria-label="遊戲選單">
        <button data-larch-action="start">打開日記</button>
        <button data-larch-action="gallery">插畫收藏</button>
      </nav>
      <div class="os">GLITCH OS　<b>yazelin.github.io/ai-brain-site</b></div>
    </div>
  </section>
  <div class="boot" aria-hidden="true"><pre><span>格莉奇OS BIOS v4.0.4 · 4KB 記憶體</span><span>CPU 單核想像力 .........</span><span>記憶體 4096B .........</span><span>載入 過度自信.dll .........</span><span>bug 引擎 ......... 這是 Feature</span><span>開啟 心情日記 .........</span></pre></div>
</main>
<script>
var WP = 'https://yazelin.github.io/ai-brain-site/images/', hr = new Date().getHours();
// 跟格莉奇OS一樣照看的人的時間換桌布：06–17 白天、17–20 黃昏、20–06 深夜
document.getElementById('wall').src = WP + (hr >= 6 && hr < 17 ? 'wallpaper-day.webp' : hr >= 17 && hr < 20 ? 'wallpaper.webp' : 'wallpaper-night.webp');
// 像素方塊：集中在右邊格莉奇附近，位置與節奏每次打開都不一樣
var box = document.getElementById('px'), C = ['#ff8fd0', '#7cf3c0', '#b78bff'];
for (var i = 0; i < 26; i++) {
  var f = document.createElement('i'), r = Math.random;
  f.className = 'px';
  f.style.cssText = 'left:' + (55 + r() * 42) + '%;top:' + (8 + r() * 70) + '%;--s:' + (4 + Math.round(r() * 6)) + 'px;--c:' + C[i % 3] +
    ';--d:' + (4 + r() * 5) + 's;--w:' + (-r() * 8) + 's;--y:' + (-10 - r() * 30) + 'px';
  box.appendChild(f);
}
// 簡介捲到底就拿掉底部的淡出
var desc = document.querySelector('[data-larch-slot="description"]');
function descEnd(){ desc.classList.toggle('end', desc.scrollTop + desc.clientHeight >= desc.scrollHeight - 2); }
desc.addEventListener('scroll', descEnd); addEventListener('resize', descEnd);
new MutationObserver(descEnd).observe(desc, {childList: true, characterData: true, subtree: true}); setTimeout(descEnd, 300);
// 讀者還在看標題時，先在背景載好月曆與日記頁要用的圖
addEventListener('load', function(){
  ['larch/ui/window.webp', 'images/wallpaper-night.webp'].forEach(function(f){ new Image().src = 'https://yazelin.github.io/ai-brain-site/' + f; });
});
</script>
