<!DOCTYPE html>
<html lang="zh-Hant" data-layout="vn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>格莉奇直播台</title>
<meta name="description" content="格莉奇的直播頁：她帶大家看視覺小說、讀留言聊天，畫面與聲音即時同步。">
<meta name="robots" content="noindex">
<link rel="icon" href="../images/glitch-logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#04080c">
<style>
  /* 配色沿用首頁（index.html）的格莉奇OS：深藍黑底、青色與薄荷綠、細白邊。 */
  :root{
    --cy:#25c2e8; --mint:#7cf3c0; --purple:#b78bff;
    --bg:#04080c; --win:#0b161d; --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.14);
    --text:#e6f6fb; --mute:#8a9aa3;
    --pet-w:300px; --chat-w:300px; --gap:12px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text); line-height:1.6; overflow:hidden;
    background:#0d2b3a radial-gradient(1200px 700px at 70% 20%,#143a4d 0%,#07131a 60%);
  }
  body::before{ /* 首頁沒桌布時那層掃描線與紫色暈光 */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:
      repeating-linear-gradient(0deg,rgba(124,243,192,.03) 0 2px,transparent 2px 4px),
      radial-gradient(600px 300px at 20% 80%,rgba(183,139,255,.18),transparent 60%);
  }

  #stage{
    position:relative; height:100%; padding:var(--gap);
    display:grid; gap:var(--gap);
    grid-template-columns:minmax(0,1fr) var(--pet-w) var(--chat-w);
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top top" "vn pet chat" "sub sub chat";
    transition:grid-template-columns .35s ease;
  }
  html[data-layout="talk"]{--pet-w:440px}
  html[data-layout="choice"]{--pet-w:190px}

  .panel{background:rgba(11,22,29,.78);border:1px solid var(--hair2);border-radius:12px;
    backdrop-filter:blur(8px);min-width:0;min-height:0}

  /* 上方一條：名稱、直播中、連線狀態 */
  #top{grid-area:top;display:flex;align-items:center;gap:12px;font-size:.85rem;color:#cdd6db}
  #top .brand{font-weight:700;letter-spacing:1px}
  #top .brand b{color:#fff}
  #top .sp{flex:1}
  #onair{display:none;align-items:center;gap:6px;color:var(--mint);font-weight:700}
  #onair::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 8px #ff4d6d}
  html:not(.waiting) #onair{display:inline-flex}
  #conn{padding:1px 10px;border-radius:99px;border:1px solid var(--hair2);color:var(--mute);font-size:.78rem}
  #conn[data-state="open"]{color:var(--mint);border-color:rgba(124,243,192,.35)}
  #conn[data-state="retry"]{color:#ffb86b;border-color:rgba(255,184,107,.35)}

  /* 視覺小說區 */
  #vn{grid-area:vn;position:relative;overflow:hidden}
  #vn-bg{position:absolute;inset:0;background:#071116 center/cover no-repeat;transition:background-image .3s ease}
  #vn-bg.empty{background-image:repeating-linear-gradient(135deg,rgba(37,194,232,.05) 0 14px,transparent 14px 28px)}
  #vn-box{position:absolute;left:14px;right:14px;bottom:14px;padding:14px 18px 16px;
    background:rgba(4,8,12,.82);border:1px solid rgba(37,194,232,.35);border-radius:10px;min-height:96px}
  #vn-speaker{position:absolute;top:-14px;left:14px;padding:1px 12px;border-radius:6px;
    background:var(--cy);color:#04121a;font-weight:700;font-size:.9rem}
  #vn-text{font-size:1.15rem;line-height:1.7;white-space:pre-wrap}
  #vn-box.narration #vn-text{color:#cfe3ea;font-style:italic}

  /* 選項與票數：疊在視覺小說區中間，choice 版面放大 */
  #choices{position:absolute;inset:auto 14px 128px 14px;margin:auto;max-width:640px;padding:12px 14px;
    background:rgba(4,8,12,.86);border:1px solid rgba(124,243,192,.4);border-radius:12px}
  #choices h2{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mint);margin-bottom:8px}
  #choice-list{list-style:none;display:grid;gap:8px}
  #choice-list li{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;
    background:rgba(255,255,255,.04);overflow:hidden}
  #choice-list li::before{content:"";position:absolute;inset:0;width:calc(var(--share,0) * 100%);
    background:linear-gradient(90deg,rgba(37,194,232,.28),rgba(124,243,192,.2));transition:width .4s ease}
  #choice-list li>*{position:relative}
  #choice-list .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
    background:var(--cy);color:#04121a;font-size:.85rem;flex:none}
  #choice-list .t{flex:1;min-width:0}
  #choice-list .c{color:var(--mint);font-variant-numeric:tabular-nums;flex:none}
  html[data-layout="choice"] #choices{inset:0;max-width:760px;height:max-content;padding:20px 22px}
  html[data-layout="choice"] #choices h2{font-size:1rem}
  html[data-layout="choice"] #choice-list li{padding:14px 16px;font-size:1.3rem}
  html[data-layout="choice"] #choice-list .n{width:34px;height:34px;font-size:1.05rem}

  /* 形象 */
  /* 畫布照比例塞進格子（像 object-fit:contain），貼底置中。比例跟著 rig.json 的
     views：寬版用全身 full，手機用半身 bust（stage.js 會同步呼叫 setView）。 */
  #pet{grid-area:pet;position:relative;overflow:hidden;container-type:size;--pet-ratio:calc(1472 / 2470)}
  #pet>canvas{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    aspect-ratio:1472/2470;height:min(100cqh, 100cqw / var(--pet-ratio));width:auto}
  #pet>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
  #pet.rigged>img{display:none}
  #pet>canvas[hidden]{display:none}
  #pet.glitching>canvas{animation:petglitch .16s steps(2) infinite}
  @keyframes petglitch{0%{transform:translate(calc(-50% + 1px),0);filter:hue-rotate(40deg)}100%{transform:translate(calc(-50% - 1px),1px);filter:none}}
  @media (prefers-reduced-motion:reduce){#pet.glitching>canvas{animation:none}}

  /* 她講的字幕 */
  #subtitle{grid-area:sub;min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;
    opacity:.35;transition:opacity .2s ease}
  #subtitle.on{opacity:1;border-color:rgba(124,243,192,.45)}
  #subtitle .who{flex:none;color:var(--mint);font-weight:700;font-size:.85rem}
  #subtitle-text{font-size:1.25rem;line-height:1.5}

  /* 留言欄 */
  #chat{grid-area:chat;display:flex;flex-direction:column;overflow:hidden}
  #chat h2{padding:10px 14px;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--hair)}
  #chat-list{list-style:none;flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px;
    scrollbar-width:thin}
  #chat-list li{font-size:.92rem;overflow-wrap:anywhere}
  #chat-list b{color:var(--cy);margin-right:8px;font-weight:600}
  #chat-empty{padding:12px 14px;color:var(--mute);font-size:.85rem}

  /* 等待畫面與進場 */
  .overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:10}
  .overlay[hidden]{display:none}
  #waiting{background:rgba(4,8,12,.72)}
  #gate{background:rgba(4,8,12,.6);z-index:20}
  .card{max-width:420px;width:100%;padding:24px;text-align:center;
    background:rgba(11,22,29,.94);border:1px solid rgba(37,194,232,.4);border-radius:14px}
  .card h1{font-size:1.4rem;margin-bottom:10px}
  .card p{color:#b8c7ce;font-size:.95rem}
  .card a{color:var(--cy);text-decoration:none;border-bottom:1px solid rgba(37,194,232,.35)}
  #enter{margin-top:16px;padding:10px 36px;border:0;border-radius:99px;cursor:pointer;
    background:linear-gradient(90deg,var(--cy),var(--mint));color:#04121a;font-size:1.05rem;font-weight:700}
  #enter:focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* 錄影用：固定 1280×720，不放站上專屬的元素 */
  html.broadcast,html.broadcast body{width:1280px;height:720px;overflow:hidden}
  html.broadcast #conn{display:none}

  /* 手機：上下排，整頁捲動，不橫向捲 */
  @media (max-width:760px){
    html:not(.broadcast) body{overflow-x:hidden;overflow-y:auto}
    html:not(.broadcast) #stage{height:auto;min-height:100%;padding:12px 16px;
      grid-template-columns:minmax(0,1fr);grid-template-rows:auto;
      grid-template-areas:"top" "vn" "pet" "sub" "chat"}
    html:not(.broadcast) #vn{height:max(300px, 75vw)}
    html:not(.broadcast) #pet{height:240px;--pet-ratio:calc(1472 / 1395)}
    html:not(.broadcast) #pet>canvas{aspect-ratio:1472/1395}
    html:not(.broadcast) #chat{height:42vh;min-height:220px}
    html:not(.broadcast) #vn-text{font-size:1rem}
    html:not(.broadcast) #subtitle-text{font-size:1.05rem}
    html:not(.broadcast)[data-layout="choice"] #choice-list li{font-size:1.05rem;padding:10px 12px}
    html:not(.broadcast) #choices{bottom:118px}
  }
</style>
</head>
<body>
<main id="stage">
  <header id="top">
    <span class="brand"><b>格莉奇</b>直播台</span>
    <span id="onair">直播中</span>
    <span class="sp"></span>
    <span id="conn" data-state="connecting">連線中</span>
  </header>

  <section id="vn" class="panel" aria-label="視覺小說">
    <div id="vn-bg" class="empty"></div>
    <div id="choices" hidden>
      <h2><span>投票選下一步</span><span id="choice-timer"></span></h2>
      <ol id="choice-list"></ol>
    </div>
    <div id="vn-box" hidden>
      <span id="vn-speaker" hidden></span>
      <p id="vn-text"></p>
    </div>
  </section>

  <section id="pet" class="panel" aria-label="格莉奇">
    <img src="../images/pet-plain.webp" alt="格莉奇">
    <canvas id="pet-canvas" hidden></canvas>
  </section>

  <section id="subtitle" class="panel" aria-live="polite">
    <span class="who">格莉奇</span>
    <p id="subtitle-text"></p>
  </section>

  <aside id="chat" class="panel" aria-label="留言">
    <h2>留言</h2>
    <p id="chat-empty">還沒有留言。</p>
    <ul id="chat-list"></ul>
  </aside>
</main>

<div id="waiting" class="overlay" hidden>
  <div class="card">
    <h1 id="waiting-text"></h1>
    <p><a id="last-show" target="_blank" rel="noopener"></a></p>
  </div>
</div>

<div id="gate" class="overlay">
  <div class="card">
    <p>按一下就聽得到格莉奇和作品的聲音。</p>
    <button id="enter" type="button">進場</button>
  </div>
</div>

<script type="module">
  import { startStage, WAITING_TEXT, LAST_SHOW } from './stage.js';
  import { mountPet } from '../glitch2d/pet.js';
  document.getElementById('waiting-text').textContent = WAITING_TEXT;
  const link = document.getElementById('last-show');
  link.textContent = LAST_SHOW.label;
  link.href = LAST_SHOW.url;
  window.liveStage = startStage({ mountPet });
</script>
</body>
</html>
