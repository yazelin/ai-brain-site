<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="格莉奇 Glitch logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2230"/>
      <stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#7cf3c0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7cf3c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- 貓耳天線 -->
  <g fill="none" stroke="#7cf3c0" stroke-width="13" stroke-linecap="round">
    <path d="M198 168 L150 104"/>
    <path d="M314 168 L362 104"/>
  </g>
  <circle cx="146" cy="98" r="22" fill="#7cf3c0"/>
  <circle cx="366" cy="98" r="22" fill="#b78bff"/>
  <!-- 臉／螢幕 -->
  <rect x="132" y="176" width="248" height="224" rx="64" fill="#0f2a36" stroke="#7cf3c0" stroke-width="9"/>
  <!-- 眼睛 -->
  <rect x="184" y="252" width="54" height="54" rx="16" fill="#7cf3c0"/>
  <rect x="274" y="252" width="54" height="54" rx="16" fill="#7cf3c0"/>
  <!-- 右眼 glitch 紫色像素塊 -->
  <rect x="286" y="264" width="34" height="13" fill="#b78bff"/>
  <rect x="296" y="284" width="22" height="11" fill="#b78bff" opacity=".8"/>
  <!-- 嘴 -->
  <rect x="214" y="346" width="84" height="16" rx="7" fill="#7cf3c0" opacity=".85"/>
  <!-- 臉頰 glitch 方塊 -->
  <rect x="152" y="330" width="15" height="15" fill="#b78bff" opacity=".7"/>
  <rect x="345" y="330" width="15" height="15" fill="#b78bff" opacity=".7"/>
</svg>